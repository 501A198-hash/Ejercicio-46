<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Wüllner 46</title>
    
    <script src="https://unpkg.com/opensheetmusicdisplay@1.9.7/build/opensheetmusicdisplay.min.js"></script>
    <script src="https://unpkg.com/@ivine/osmd-audio-player@1.7.0/dist/browser/osmd-audio-player.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8f9fa; text-align: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: inline-block; width: 95%; max-width: 850px; }
        .controls { background: #ffffff; border: 2px solid #eee; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        button { background-color: #2ecc71; color: white; border: none; padding: 15px 35px; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #27ae60; transform: scale(1.02); }
        #score-container { background: white; min-height: 350px; border-radius: 10px; margin-top: 20px; }
        .error-msg { color: #e74c3c; background: #fdf2f2; padding: 15px; border-radius: 10px; display: none; margin: 15px 0; border: 1px solid #fab1a0; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="color: #2c3e50; margin-bottom: 5px;">Lectura Musical I - UMSS</h2>
        <h4 style="color: #95a5a6; margin-top: 0;">Ejercicio 46 (Wüllner)</h4>
        
        <div class="controls">
            <button id="btn-play">▶ REPRODUCIR / PAUSA</button>
            <div style="margin-top: 15px;">
                <label style="font-weight: bold; color: #34495e;">Tempo:</label>
                <input type="range" id="tempo-slider" min="30" max="160" value="100">
                <span id="tempo-val" style="font-weight: bold;">100 BPM</span>
            </div>
        </div>

        <div id="error-display" class="error-msg"></div>
        <div id="score-container">Cargando motor de música...</div>
    </div>

    <script>
        async function loadMusic() {
            const errorDiv = document.getElementById("error-display");
            const scoreDiv = document.getElementById("score-container");

            // SEGURO: Verificamos si la librería de audio cargó correctamente
            if (typeof OsmdAudioPlayer === 'undefined') {
                errorDiv.style.display = "block";
                errorDiv.innerText = "El motor de audio tardó demasiado. Reintentando carga...";
                // Reintento automático en 2 segundos
                setTimeout(loadMusic, 2000);
                return;
            }

            errorDiv.style.display = "none";
            const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("score-container");
            const audioPlayer = new OsmdAudioPlayer();

            try {
                // Cargamos tu archivo. Asegúrate que se llame exactamente así en GitHub.
                await osmd.load("ejercicio46.xml"); 
                osmd.render();
                await audioPlayer.loadScore(osmd);
                scoreDiv.style.minHeight = "auto";
                console.log("¡Partitura lista!");
            } catch (e) {
                errorDiv.style.display = "block";
                errorDiv.innerText = "Error: No se encontró el archivo 'ejercicio46.xml'. Verifica que esté subido a GitHub.";
            }

            document.getElementById("btn-play").onclick = () => {
                if (audioPlayer.state === "STOPPED" || audioPlayer.state === "PAUSED") {
                    audioPlayer.play();
                } else {
                    audioPlayer.pause();
                }
            };

            document.getElementById("tempo-slider").oninput = (e) => {
                const bpm = e.target.value;
                document.getElementById("tempo-val").innerText = bpm + " BPM";
                audioPlayer.setTempo(bpm);
            };
        }

        // Ejecutar cuando todo esté listo
        window.addEventListener('load', loadMusic);
    </script>
</body>
</html>
