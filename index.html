<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Wüllner 46 - UMSS</title>
    
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.8/build/opensheetmusicdisplay.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/osmd-audio-player@1.1.0/dist/osmd-audio-player.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; text-align: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; width: 95%; max-width: 850px; }
        .controls { background: #ffffff; border: 1px solid #ddd; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        button { background-color: #27ae60; color: white; border: none; padding: 15px 35px; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; }
        button:hover { background-color: #219150; }
        #score-container { background: white; min-height: 300px; border-radius: 10px; margin-top: 20px; border: 1px solid #eee; }
        .error-msg { color: #c0392b; background: #f9ebea; padding: 15px; border-radius: 10px; display: none; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="color: #2c3e50;">Lectura Musical I - UMSS</h2>
        <h4 style="color: #7f8c8d; margin-top: -10px;">Ejercicio 46 (Wüllner)</h4>
        
        <div class="controls">
            <button id="btn-play">▶ REPRODUCIR / PAUSA</button>
            <div style="margin-top: 15px;">
                <label style="font-weight: bold;">Tempo:</label>
                <input type="range" id="tempo-slider" min="30" max="160" value="100">
                <span id="tempo-val" style="font-weight: bold;">100 BPM</span>
            </div>
        </div>

        <div id="error-display" class="error-msg"></div>
        <div id="score-container">Cargando partitura...</div>
    </div>

    <script>
        async function loadMusic() {
            const errorDiv = document.getElementById("error-display");
            
            // Verificamos carga de librerías
            if (typeof opensheetmusicdisplay === 'undefined' || typeof OsmdAudioPlayer === 'undefined') {
                errorDiv.style.display = "block";
                errorDiv.innerText = "Error: El navegador bloqueó los archivos de música. Por favor, presiona Ctrl+F5.";
                return;
            }

            const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("score-container");
            const audioPlayer = new OsmdAudioPlayer();

            try {
                // Nombre del archivo EXACTO
                await osmd.load("ejercicio46.xml"); 
                osmd.render();
                await audioPlayer.loadScore(osmd);
                document.getElementById("score-container").style.minHeight = "auto";
                console.log("¡Listo!");
            } catch (e) {
                errorDiv.style.display = "block";
                errorDiv.innerText = "Error: No se encontró 'ejercicio46.xml'. Revisa el nombre del archivo en GitHub.";
            }

            document.getElementById("btn-play").onclick = () => {
                if (audioPlayer.state === "STOPPED" || audioPlayer.state === "PAUSED") {
                    audioPlayer.play();
                } else {
                    audioPlayer.pause();
                }
            };

            document.getElementById("tempo-slider").oninput = (e) => {
                const bpm = e.target.value;
                document.getElementById("tempo-val").innerText = bpm + " BPM";
                audioPlayer.setTempo(bpm);
            };
        }

        window.onload = loadMusic;
    </script>
</body>
</html>
